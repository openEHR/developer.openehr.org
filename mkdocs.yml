site_name: openEHR Developer Guide
site_description: Developer guidance for implementing and conforming to openEHR.
site_url: https://developer.openehr.org/
repo_url: https://github.com/openEHR/developer.openehr.org
repo_name: openEHR/developer.openehr.org
edit_uri: edit/main/docs/
copyright: Copyright 2026 openEHR International. Content is licensed under CC BY-SA 4.0.

theme:
  variant: modern
  logo: assets/openehr-logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.footer

nav:
  - Home: index.md
  - Tooling:
      - Overview: tooling/index.md
      - Archetype Authoring: tooling/archetype-authoring.md
      - Template Authoring: tooling/template-authoring.md
      - Clinical Data Repositories: tooling/clinical-data-repositories.md
      - Knowledge Management: tooling/knowledge-management.md
      - Developer Tooling: tooling/developer-tooling.md
      - Query Tools: tooling/query-tools.md
      - Deprecated Tools: tooling/deprecated-tools.md
      - Comparison Table: tooling/comparison-table.md
      - Getting Help: tooling/getting-help.md
  - Implementation:
      - Overview: implementation/index.md
  - Conformance:
      - Overview: conformance/index.md

extra_css:
  - stylesheets/extra.css
